# Load from repo root:
#   pnpm dsh web --patch ./extras/dsh-nl2sql/cordis.yml
#
# On Windows, `name` cannot be E:/... (Node treats E: as a URL scheme).
# Relative names are resolved from THIS yaml file's directory.

- insert:
    - id: nl2sql-mysql
      name: ./src/index.ts
      config:
        host: 127.0.0.1
        port: 3306
        user: root
        password: ""
        database: your_db
        schemaDir: E:/project/deepseek-harness/extras/dsh-nl2sql/schemas
        sampleLimit: 5
        queryLimit: 50
