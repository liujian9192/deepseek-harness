# Load from repo root:
#   pnpm dsh web --patch ./extras/dsh-nl2sql/cordis.yml
#
# `name` MUST be an absolute path. Relative paths are resolved against this
# yaml file and become extras/dsh-nl2sql/extras/dsh-nl2sql/src/index.ts.

- insert:
    - id: nl2sql-mysql
      name: E:/project/deepseek-harness/extras/dsh-nl2sql/src/index.ts
      config:
        host: 127.0.0.1
        port: 3306
        user: root
        password: ""
        database: your_db
        schemaDir: E:/project/deepseek-harness/extras/dsh-nl2sql/schemas
        sampleLimit: 5
        queryLimit: 50
